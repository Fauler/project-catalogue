server:
  port: 8083
spring:
  application:
    name: auth-service
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:120000}
auth:
  allowed-client-ids: ${ALLOWED_CLIENT_IDS:client-user-01,client-admin-01}
  admin-client-ids: ${ADMIN_CLIENT_IDS:client-admin-01}
clients:
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  metrics:
    export:
      otlp:
        enabled: false
logging:
  level:
    com.project.catalogue: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
