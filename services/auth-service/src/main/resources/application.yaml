server:
  port: 8083
spring:
  application:
    name: auth-service
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
auth:
  allowed-client-ids: ${ALLOWED_CLIENT_IDS:client-user-01,client-admin-01}
  admin-client-ids: ${ADMIN_CLIENT_IDS:client-admin-01}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
logging:
  level:
    com.project.catalogue: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
