server:
  port: 8081
spring:
  application:
    name: user-service
  security:
    user:
      name: user
      password: my-user-secret
  datasource:
    url: jdbc:h2:file:./data/user-service;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
logging:
  level:
    com.project.catalogue: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
