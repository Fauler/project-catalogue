server:
  port: 8081
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:20081/user_service}
    username: ${DB_USERNAME:user_service}
    password: ${DB_PASSWORD:user_service}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      properties:
        spring.json.add.type.headers: false
jwt:
  secret: ${JWT_SECRET}
catalogue:
  events:
    user-deleted:
      topic: ${USER_DELETED_TOPIC:user.deleted}
      partitions: ${USER_DELETED_TOPIC_PARTITIONS:1}
      replicas: ${USER_DELETED_TOPIC_REPLICAS:1}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0
logging:
  level:
    com.project.catalogue: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
