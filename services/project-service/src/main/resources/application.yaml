server:
  port: 8082
spring:
  application:
    name: project-service
  security:
    user:
      password: my-project-secret
  datasource:
    url: jdbc:h2:file:./data/project-service;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
clients:
  user-service:
    base-url: http://localhost:8081
    username: user
    password: my-user-secret
