services:
  postgres-user:
    image: postgres:17-alpine
    ports:
      - "20081:5432"
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_service"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - catalogue-network

  postgres-project:
    image: postgres:17-alpine
    ports:
      - "20082:5432"
    environment:
      POSTGRES_DB: project_service
      POSTGRES_USER: project_service
      POSTGRES_PASSWORD: project_service
    volumes:
      - postgres-project-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_service -d project_service"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - catalogue-network

  user-service:
    build:
      context: .
      dockerfile: infrastructure/docker/user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-ZGV2LWF1dGgtand0LXNlY3JldC1mb3ItcHJvamVjdC1jYXRhbG9ndWUtMjAyNg==}
      DB_URL: jdbc:postgresql://postgres-user:5432/user_service
      DB_USERNAME: user_service
      DB_PASSWORD: user_service
    restart: always
    depends_on:
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - catalogue-network

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/auth-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-ZGV2LWF1dGgtand0LXNlY3JldC1mb3ItcHJvamVjdC1jYXRhbG9ndWUtMjAyNg==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ALLOWED_CLIENT_IDS: ${ALLOWED_CLIENT_IDS:-client-user-01,client-admin-01}
      ADMIN_CLIENT_IDS: ${ADMIN_CLIENT_IDS:-client-admin-01}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - catalogue-network

  project-service:
    build:
      context: .
      dockerfile: infrastructure/docker/project-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-ZGV2LWF1dGgtand0LXNlY3JldC1mb3ItcHJvamVjdC1jYXRhbG9ndWUtMjAyNg==}
      DB_URL: jdbc:postgresql://postgres-project:5432/project_service
      DB_USERNAME: project_service
      DB_PASSWORD: project_service
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
    restart: always
    depends_on:
      postgres-project:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - catalogue-network

volumes:
  postgres-user-data:
  postgres-project-data:

networks:
  catalogue-network:
    driver: bridge
