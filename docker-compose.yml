services:
  postgres-user:
    image: postgres:17-alpine
    ports:
      - "20081:5432"
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_service"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - catalogue-network

  postgres-project:
    image: postgres:17-alpine
    ports:
      - "20082:5432"
    environment:
      POSTGRES_DB: project_service
      POSTGRES_USER: project_service
      POSTGRES_PASSWORD: project_service
    volumes:
      - postgres-project-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_service -d project_service"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - catalogue-network

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - catalogue-network

  user-service:
    build:
      context: .
      dockerfile: infrastructure/docker/user-service/Dockerfile
    ports:
      - "8081:8081"
      - "5081:5005"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-bXktand0U2VjcmV0LWZvci1sb2NhbC1wb3J0dWdhbC1saXNib2EtMjAyNg==}
      DB_URL: jdbc:postgresql://postgres-user:5432/user_service
      DB_USERNAME: user_service
      DB_PASSWORD: user_service
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      JAVA_DEBUG_OPTS: ${JAVA_DEBUG_OPTS:-}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 0.0
    restart: always
    depends_on:
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - catalogue-network

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/auth-service/Dockerfile
    ports:
      - "8083:8083"
      - "5083:5005"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-bXktand0U2VjcmV0LWZvci1sb2NhbC1wb3J0dWdhbC1saXNib2EtMjAyNg==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-120000}
      ALLOWED_CLIENT_IDS: ${ALLOWED_CLIENT_IDS:-client-user-01,client-admin-01}
      ADMIN_CLIENT_IDS: ${ADMIN_CLIENT_IDS:-client-admin-01}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
      JAVA_DEBUG_OPTS: ${JAVA_DEBUG_OPTS:-}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 0.0
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      user-service:
        condition: service_healthy
    networks:
      - catalogue-network

  project-service:
    build:
      context: .
      dockerfile: infrastructure/docker/project-service/Dockerfile
    ports:
      - "8082:8082"
      - "5082:5005"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-bXktand0U2VjcmV0LWZvci1sb2NhbC1wb3J0dWdhbC1saXNib2EtMjAyNg==}
      DB_URL: jdbc:postgresql://postgres-project:5432/project_service
      DB_USERNAME: project_service
      DB_PASSWORD: project_service
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      JAVA_DEBUG_OPTS: ${JAVA_DEBUG_OPTS:-}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 0.0
    restart: always
    depends_on:
      postgres-project:
        condition: service_healthy
      user-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - catalogue-network

volumes:
  postgres-user-data:
  postgres-project-data:

networks:
  catalogue-network:
    driver: bridge
